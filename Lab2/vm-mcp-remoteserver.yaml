---
# Registers the in-cluster VictoriaMetrics MCP server (deployed by the
# vm-mcp HelmRelease in the `monitoring` namespace) with kagent.
# RemoteMCPServer does not deploy a workload — it is a client-side
# reference to an already-running MCP endpoint.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: vm-mcp
  namespace: kagent
spec:
  description: VictoriaMetrics MCP — query VM via PromQL/MetricsQL from kagent
  protocol: STREAMABLE_HTTP
  url: http://vm-mcp.monitoring.svc.cluster.local:8080/mcp
  timeout: 30s
  terminateOnClose: true
